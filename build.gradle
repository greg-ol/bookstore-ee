plugins {
    id 'java'
    id 'war'
}

group 'com.bookstore.go'
version '1.0-SNAPSHOT'

var hibernateVersion = "6.6.3.Final"


repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
}

java {
    sourceCompatibility = '8'
    targetCompatibility = '8'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    implementation('org.glassfish.jersey.containers:jersey-container-servlet:4.0.2')
    implementation('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.2')
    implementation('org.glassfish.jersey.inject:jersey-cdi2-se:4.0.2')
    implementation("org.hibernate.orm:hibernate-core:$hibernateVersion")
    implementation('org.glassfish.jaxb:jaxb-runtime:4.0.9')
    implementation('org.hibernate.validator:hibernate-validator:9.1.3.Final')
    implementation('org.jboss.weld.se:weld-se-core:6.0.4.Final')
//    implementation("org.glassfish.jersey.containers:jersey-container-servlet:$jerseyVersion")
    implementation("org.glassfish.jersey.inject:jersey-hk2:4.0.2")
    // implementation("org.glassfish.jersey.media:jersey-media-json-jackson:$jerseyVersion")

    // In-memory database
    implementation("com.h2database:h2:2.3.232")

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}