plugins {
    id 'java'
    id 'war'
}

group 'com.bookstoreee'
version '1.0-SNAPSHOT'

var hibernateVersion = "7.4.14.Final"
var jerseyVersion = "3.1.11"


repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
}

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
//    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
//    implementation('org.glassfish.jersey.containers:jersey-container-servlet:4.0.2')
//    implementation('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.2')
//    implementation('org.glassfish.jersey.inject:jersey-cdi2-se:4.0.2')
//    implementation("org.hibernate.orm:hibernate-core:$hibernateVersion")
//    implementation('org.glassfish.jaxb:jaxb-runtime:4.0.9')
//    implementation('org.hibernate.validator:hibernate-validator:9.1.3.Final')
//    implementation('org.jboss.weld.se:weld-se-core:6.0.4.Final')
////    implementation("org.glassfish.jersey.containers:jersey-container-servlet:$jerseyVersion")
//    implementation("org.glassfish.jersey.inject:jersey-hk2:4.0.2")
//    // implementation("org.glassfish.jersey.media:jersey-media-json-jackson:$jerseyVersion")
//
//    // In-memory database
//    implementation("com.h2database:h2:2.3.232")
//
//    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
//    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    // Provided by Tomcat 10.1 (Servlet 6.0, jakarta.* namespace)
    providedCompile("jakarta.servlet:jakarta.servlet-api:6.0.0")

    // Jakarta REST (JAX-RS) implementation, bundled in the WAR
    implementation("org.glassfish.jersey.containers:jersey-container-servlet:$jerseyVersion")
    implementation("org.glassfish.jersey.inject:jersey-hk2:$jerseyVersion")
    implementation("org.glassfish.jersey.media:jersey-media-json-jackson:$jerseyVersion")
    implementation("jakarta.inject:jakarta.inject-api:2.0.1")

    // JPA provider + Bean Validation, bundled in the WAR
    implementation("org.hibernate.orm:hibernate-core:$hibernateVersion")
    implementation("org.hibernate.validator:hibernate-validator:8.0.1.Final")

    // In-memory database
    implementation("com.h2database:h2:2.3.232")

    constraints {
        implementation("net.bytebuddy:byte-buddy:1.17.7") {
            because("Hibernate's default Byte Buddy predates Java 25 class files")
        }
    }

    testImplementation(platform("org.junit:junit-bom:5.13.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}