opencollection: 1.0.0

info:
  name: bookstore-ee
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: host
      value: localhost
    - name: port
      value: "9090"
    - name: api
      value: bookstore-ee-1.0-SNAPSHOT/api/books
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
